<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>DEV — כל הרכיבים — מדידת נפח מוצק</title>
  <!-- Unit-level dev wrapper: one jump bar across all seven parts. Each part's own index_dev.html
       still works on its own; this one frames the part's index.html and speaks the same
       DEV_READY / DEV_GOTO protocol (unit-js/60-devbridge.js). -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: monospace; }

    #dev-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 44px;
      background: #f9ca24; color: #1a1a2e;
      display: flex; align-items: center; gap: 10px;
      padding: 0 12px; z-index: 9999; font-size: 13px; font-weight: 700;
      direction: ltr;
    }
    #dev-bar span { background: #1a1a2e; color: #f9ca24; padding: 2px 8px; border-radius: 4px; }
    #dev-bar button {
      height: 28px; padding: 0 12px; border: none; border-radius: 4px;
      background: #1a1a2e; color: #f9ca24; font-weight: 700; cursor: pointer; font-size: 13px;
    }
    #dev-bar button:hover { background: #333; }
    #dev-bar button.part { padding: 0 9px; background: #fff3c4; color: #1a1a2e; }
    #dev-bar button.part.active { background: #1a1a2e; color: #f9ca24; }
    #dev-bar input[type=number] {
      width: 54px; height: 28px; border: none; border-radius: 4px;
      text-align: center; font-size: 14px; font-weight: 700;
    }
    #parts { display: flex; gap: 4px; }

    #lomda-frame {
      position: fixed; top: 44px; left: 0; right: 0; bottom: 0;
      border: none; width: 100%; height: calc(100% - 44px);
    }
  </style>
</head>
<body>

<div id="dev-bar">
  <span>DEV</span>
  <div id="parts"></div>
  <button onclick="nav(+1)" title="קדימה (RTL: שמאל = קדימה)">◀</button>
  <span id="dev-label">S 0 / ?</span>
  <button onclick="nav(-1)" title="אחורה (RTL: ימין = אחורה)">▶</button>
  <input type="number" id="jump-input" min="0" value="0" onkeydown="if(event.key==='Enter')jumpTo()">
  <button onclick="jumpTo()">Go</button>
  <span style="margin-right:auto; font-size:11px; font-weight:400;">Ctrl+← קדימה &nbsp;|&nbsp; Ctrl+→ אחורה</span>
</div>

<iframe id="lomda-frame"></iframe>

<script>
  const PARTS = ['01', '02', '03', '04', '05', '06', '07'];
  /* ?resetState (unit-js/40-resume.js): without it, resume hops straight back to whichever part the
     saved state names, so picking 03 would land on 01. The lomda strips it after one read. */
  const partUrl = p => './methodica-science-volume-solid-01-' + p + '/index.html?resetState';

  let part = 0;        // index into PARTS
  let cur = 0;
  let total = 1;
  let order = null;    // the part's flow order (DEV_FLOW_ORDER), when it has one
  let pending = null;  // 'first' | 'last' — where to land once a newly loaded part reports in

  function steps() { return order || Array.from({ length: total }, (_, i) => i); }

  const frame  = document.getElementById('lomda-frame');
  const label  = document.getElementById('dev-label');
  const input  = document.getElementById('jump-input');
  const partsEl = document.getElementById('parts');

  PARTS.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'part';
    b.textContent = p;
    b.title = 'רכיב ' + p;
    b.onclick = () => loadPart(i, 'first');
    partsEl.appendChild(b);
  });

  function markActive() {
    [...partsEl.children].forEach((b, i) => b.classList.toggle('active', i === part));
    try { history.replaceState(null, '', '#' + PARTS[part]); } catch (e) {}
  }

  function loadPart(i, where) {
    part = i;
    pending = where;
    total = 1; order = null; cur = 0;
    markActive();
    updateLabel();
    frame.src = partUrl(PARTS[i]);
  }

  // The lomda can move itself to the next part; keep the bar in step with whatever is framed.
  frame.addEventListener('load', () => {
    try {
      const m = frame.contentWindow.location.pathname.match(/solid-01-(\d\d)\//);
      const i = m ? PARTS.indexOf(m[1]) : -1;
      if (i !== -1 && i !== part) { part = i; pending = null; cur = 0; markActive(); }
    } catch (e) {}
  });

  window.addEventListener('message', e => {
    if (e.data?.type !== 'DEV_READY') return;
    total = e.data.total;
    order = Array.isArray(e.data.order) ? e.data.order : null;
    const s = steps();
    if (pending === 'first') send(s[0]);
    else if (pending === 'last') send(s[s.length - 1]);
    pending = null;
    updateLabel();
  });

  function send(n) {
    frame.contentWindow.postMessage({ type: 'DEV_GOTO', screen: n }, '*');
    cur = n;
    input.value = n;
    updateLabel();
  }

  // Past either end of a part, step into the neighbouring part.
  function nav(delta) {
    const s = steps();
    let i = s.indexOf(cur);
    if (i === -1) i = 0;
    const j = i + delta;
    if (j >= s.length) { if (part < PARTS.length - 1) loadPart(part + 1, 'first'); return; }
    if (j < 0)         { if (part > 0) loadPart(part - 1, 'last'); return; }
    send(s[j]);
  }

  function jumpTo() {
    const n = parseInt(input.value, 10);
    if (!isNaN(n) && n >= 0 && n < total) send(n);
  }

  function updateLabel() {
    const s = steps(), i = s.indexOf(cur);
    label.textContent = PARTS[part] + '  ·  S ' + cur + '  ·  ' + (i + 1) + ' / ' + s.length;
  }

  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'ArrowLeft')  nav(+1);
    if (e.ctrlKey && e.key === 'ArrowRight') nav(-1);
  });

  // Open on the part named in the hash (index_dev.html#04), else part 01.
  const start = PARTS.indexOf(location.hash.slice(1));
  loadPart(start === -1 ? 0 : start, 'first');
</script>
</body>
</html>
