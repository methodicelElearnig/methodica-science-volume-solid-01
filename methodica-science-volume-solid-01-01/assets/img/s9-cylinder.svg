    <line x1="133" y1="175.2" x2="138" y2="175.2"/>
    <line x1="133" y1="171.6" x2="138" y2="171.6"/>
    <line x1="133" y1="164.4" x2="138" y2="164.4"/>
    <line x1="133" y1="160.8" x2="138" y2="160.8"/>
    <line x1="133" y1="157.2" x2="138" y2="157.2"/>
    <line x1="133" y1="153.6" x2="138" y2="153.6"/>
    <line x1="133" y1="146.4" x2="138" y2="146.4"/>
    <line x1="133" y1="142.8" x2="138" y2="142.8"/>
    <line x1="133" y1="139.2" x2="138" y2="139.2"/>
    <line x1="133" y1="135.6" x2="138" y2="135.6"/>
    <line x1="133" y1="128.4" x2="138" y2="128.4"/>
    <line x1="133" y1="124.8" x2="138" y2="124.8"/>
    <line x1="133" y1="121.2" x2="138" y2="121.2"/>
    <line x1="133" y1="117.6" x2="138" y2="117.6"/>
    <line x1="133" y1="110.4" x2="138" y2="110.4"/>
    <line x1="133" y1="106.8" x2="138" y2="106.8"/>
    <line x1="133" y1="103.2" x2="138" y2="103.2"/>
    <line x1="133" y1="99.6" x2="138" y2="99.6"/>
    <line x1="133" y1="92.4" x2="138" y2="92.4"/>
    <line x1="133" y1="88.8" x2="138" y2="88.8"/>
    <line x1="133" y1="85.2" x2="138" y2="85.2"/>
    <line x1="133" y1="81.6" x2="138" y2="81.6"/>
    <line x1="133" y1="74.4" x2="138" y2="74.4"/>
    <line x1="133" y1="70.8" x2="138" y2="70.8"/>
    <line x1="133" y1="67.2" x2="138" y2="67.2"/>
    <line x1="133" y1="63.6" x2="138" y2="63.6"/>
  </g>
  <g fill="#a85d2a" font-family="Assistant, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="end">
    <text x="116" y="64">100</text>
    <text x="116" y="100">90</text>
    <text x="116" y="136">80</text>
    <text x="116" y="172">70</text>
    <text x="116" y="208">60</text>
    <text x="116" y="244">50</text>
    <text x="116" y="280">40</text>
    <text x="116" y="316">30</text>
    <text x="116" y="352">20</text>
    <text x="116" y="388">10</text>
  </g>
  <!-- The unit label clears the lip now; it used to sit on the rim ellipse (QA 2026-08-29). -->
  <text x="138" y="26" fill="#a85d2a" font-family="Assistant, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="end">ml</text>
</svg>
