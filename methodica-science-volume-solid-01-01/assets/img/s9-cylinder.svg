<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 480" width="200" height="480" role="img" aria-label="משורה מדורגת">
  <!-- Graduated cylinder, redrawn 2026-08-29 towards the storyboard photograph — chiefly the FOOT,
       which used to be a thin tapered stem dropped onto a flat disc. In the photo the tube flares
       smoothly into a thick pressed-glass base, so that is what this draws.

       GEOMETRY IS A CONTRACT with css/style.css, which overlays .disp-water, .disp-sunk-marble and
       .disp-badge on this by PERCENTAGE of the wrap:
         viewBox stays 200 x 480;
         0 mL sits at y = 420 (= bottom 12.5%), 100 mL at y = 60, so y = 420 - 3.6 * V;
         50 mL = 50%, 62 mL = 41%, the sunk marble rests at 82%;
         the bore runs x 61 -> 139, and .disp-water is inset 2 units inside that for wall thickness.
       Change any of those and the water reads against the wrong graduation. -->
  <defs>
    <!-- Cylindrical shading: glass is brightest where it turns away at the edges. -->
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#cfe8f6" stop-opacity="0.85"/>
      <stop offset="14%"  stop-color="#f6fbfe" stop-opacity="0.55"/>
      <stop offset="46%"  stop-color="#eaf5fc" stop-opacity="0.30"/>
      <stop offset="82%"  stop-color="#f3fafd" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#c8e3f4" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c5e2f2"/>
      <stop offset="20%"  stop-color="#f4fafe"/>
      <stop offset="55%"  stop-color="#e2f0fa"/>
      <stop offset="85%"  stop-color="#f6fbfe"/>
      <stop offset="100%" stop-color="#bcdcef"/>
    </linearGradient>
    <!-- The solid glass slug between the bore floor and the foot. It reads darker than the tube
         because you are looking through 20 units of glass rather than through air. -->
    <linearGradient id="plug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d3e9f6"/>
      <stop offset="100%" stop-color="#eaf5fc"/>
    </linearGradient>
  </defs>

  <!-- foot: the disc first, then its edge thickness, then the flare — drawn bottom-up so the
       tube above overlaps them cleanly -->
  <ellipse cx="100" cy="452" rx="52" ry="12" fill="#bcdcef"/>
  <path d="M48 452 A52 12 0 0 0 152 452 L152 445 A52 12 0 0 1 48 445 Z" fill="#a9d0e8"/>
  <ellipse cx="100" cy="445" rx="52" ry="12" fill="url(#foot)" stroke="#7fb8d6" stroke-width="2.5"/>
  <path d="M62 420 L62 428 Q62 436 74 440 L126 440 Q138 436 138 428 L138 420 Z"
        fill="url(#plug)" stroke="#7fb8d6" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- tube -->
  <path d="M58 44 L58 424 Q58 434 68 438 L132 438 Q142 434 142 424 L142 44 Z"
        fill="url(#tube)" stroke="#7fb8d6" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Bore floor: the flat the water column stands on, with the fillet a moulded cylinder has. -->
  <path d="M61 404 L61 414 Q61 420 68 420 L132 420 Q139 420 139 414 L139 404"
        fill="none" stroke="#9fcbe2" stroke-width="2"/>
  <!-- Inner wall lines, so the glass reads as having thickness rather than as a printed outline. -->
  <line x1="61" y1="52" x2="61" y2="410" stroke="#a8d0e6" stroke-width="1.4" opacity="0.85"/>
  <line x1="139" y1="52" x2="139" y2="410" stroke="#a8d0e6" stroke-width="1.4" opacity="0.85"/>

  <!-- rolled lip: the outer bead, then the bore opening inside it -->
  <ellipse cx="100" cy="44" rx="45" ry="8.5" fill="#f2f9fd" stroke="#7fb8d6" stroke-width="2.5"/>
  <ellipse cx="100" cy="45" rx="39" ry="6" fill="#dcecf7" stroke="#9fcbe2" stroke-width="1.4"/>

  <!-- reflections -->
  <rect x="67" y="58" width="6" height="352" rx="3" fill="#ffffff" opacity="0.55"/>
  <rect x="128" y="70" width="3" height="320" rx="1.5" fill="#ffffff" opacity="0.3"/>

  <!-- graduated scale, y = 420 - 3.6 * V -->
  <!-- majors every 10 mL -->
  <g stroke="#a85d2a" stroke-width="2" stroke-linecap="round">
    <line x1="120" y1="60"  x2="138" y2="60"/>
    <line x1="120" y1="96"  x2="138" y2="96"/>
    <line x1="120" y1="132" x2="138" y2="132"/>
    <line x1="120" y1="168" x2="138" y2="168"/>
    <line x1="120" y1="204" x2="138" y2="204"/>
    <line x1="120" y1="240" x2="138" y2="240"/>
    <line x1="120" y1="276" x2="138" y2="276"/>
    <line x1="120" y1="312" x2="138" y2="312"/>
    <line x1="120" y1="348" x2="138" y2="348"/>
    <line x1="120" y1="384" x2="138" y2="384"/>
    <line x1="120" y1="420" x2="138" y2="420"/>
  </g>
  <!-- mid ticks every 5 mL -->
  <g stroke="#a85d2a" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
    <line x1="127" y1="78"  x2="138" y2="78"/>
    <line x1="127" y1="114" x2="138" y2="114"/>
    <line x1="127" y1="150" x2="138" y2="150"/>
    <line x1="127" y1="186" x2="138" y2="186"/>
    <line x1="127" y1="222" x2="138" y2="222"/>
    <line x1="127" y1="258" x2="138" y2="258"/>
    <line x1="127" y1="294" x2="138" y2="294"/>
    <line x1="127" y1="330" x2="138" y2="330"/>
    <line x1="127" y1="366" x2="138" y2="366"/>
    <line x1="127" y1="402" x2="138" y2="402"/>
  </g>
  <!-- minors every 2 mL — the fine comb the photograph shows between the numbered lines -->
  <g stroke="#a85d2a" stroke-width="1" stroke-linecap="round" opacity="0.62">
    <line x1="132" y1="67.2" x2="138" y2="67.2"/><line x1="132" y1="74.4" x2="138" y2="74.4"/>
    <line x1="132" y1="81.6" x2="138" y2="81.6"/><line x1="132" y1="88.8" x2="138" y2="88.8"/>
    <line x1="132" y1="103.2" x2="138" y2="103.2"/><line x1="132" y1="110.4" x2="138" y2="110.4"/>
    <line x1="132" y1="117.6" x2="138" y2="117.6"/><line x1="132" y1="124.8" x2="138" y2="124.8"/>
    <line x1="132" y1="139.2" x2="138" y2="139.2"/><line x1="132" y1="146.4" x2="138" y2="146.4"/>
    <line x1="132" y1="153.6" x2="138" y2="153.6"/><line x1="132" y1="160.8" x2="138" y2="160.8"/>
    <line x1="132" y1="175.2" x2="138" y2="175.2"/><line x1="132" y1="182.4" x2="138" y2="182.4"/>
    <line x1="132" y1="189.6" x2="138" y2="189.6"/><line x1="132" y1="196.8" x2="138" y2="196.8"/>
    <line x1="132" y1="211.2" x2="138" y2="211.2"/><line x1="132" y1="218.4" x2="138" y2="218.4"/>
    <line x1="132" y1="225.6" x2="138" y2="225.6"/><line x1="132" y1="232.8" x2="138" y2="232.8"/>
    <line x1="132" y1="247.2" x2="138" y2="247.2"/><line x1="132" y1="254.4" x2="138" y2="254.4"/>
    <line x1="132" y1="261.6" x2="138" y2="261.6"/><line x1="132" y1="268.8" x2="138" y2="268.8"/>
    <line x1="132" y1="283.2" x2="138" y2="283.2"/><line x1="132" y1="290.4" x2="138" y2="290.4"/>
    <line x1="132" y1="297.6" x2="138" y2="297.6"/><line x1="132" y1="304.8" x2="138" y2="304.8"/>
    <line x1="132" y1="319.2" x2="138" y2="319.2"/><line x1="132" y1="326.4" x2="138" y2="326.4"/>
    <line x1="132" y1="333.6" x2="138" y2="333.6"/><line x1="132" y1="340.8" x2="138" y2="340.8"/>
    <line x1="132" y1="355.2" x2="138" y2="355.2"/><line x1="132" y1="362.4" x2="138" y2="362.4"/>
    <line x1="132" y1="369.6" x2="138" y2="369.6"/><line x1="132" y1="376.8" x2="138" y2="376.8"/>
    <line x1="132" y1="391.2" x2="138" y2="391.2"/><line x1="132" y1="398.4" x2="138" y2="398.4"/>
    <line x1="132" y1="405.6" x2="138" y2="405.6"/><line x1="132" y1="412.8" x2="138" y2="412.8"/>
  </g>
  <g fill="#a85d2a" font-family="Assistant, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="end">
    <text x="116" y="64">100</text>
    <text x="116" y="100">90</text>
    <text x="116" y="136">80</text>
    <text x="116" y="172">70</text>
    <text x="116" y="208">60</text>
    <text x="116" y="244">50</text>
    <text x="116" y="280">40</text>
    <text x="116" y="316">30</text>
    <text x="116" y="352">20</text>
    <text x="116" y="388">10</text>
  </g>
  <!-- The unit label clears the lip now; it used to sit on the rim ellipse (QA 2026-08-29). -->
  <text x="138" y="26" fill="#a85d2a" font-family="Assistant, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="end">ml</text>
</svg>
