<svg xmlns="http://www.w3.org/2000/svg" viewBox="19 25 104 68" width="104" height="68" role="img" aria-label="פטיש">
  <!-- Horizontal, head to the left (QA 2026-08-29). The artwork is the original upright drawing
       turned a quarter turn rather than redrawn: `rotate(-90 60 65)` maps x' = y and y' = 120 - x,
       so the old content box (x 27..95, y 19..123) lands at x 19..123, y 25..93 — which is exactly
       this viewBox, tight to the art. Size it by WIDTH; the 104:68 ratio is the hammer's length to
       its height.
       The upright version's ground shadow is gone with the turn: this one is shown lying in a bowl
       of water as well as standing in the drag zone, and a cast shadow under water reads wrong.
       #metal ran vertically and now shades the head along its length; #wood ran across the handle
       and now lights it from above. Both improved by the turn, which is why neither was touched. -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2c8d0"/>
      <stop offset="50%" stop-color="#9aa1ab"/>
      <stop offset="100%" stop-color="#6d747e"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d3944e"/>
      <stop offset="100%" stop-color="#a5692f"/>
    </linearGradient>
  </defs>
  <g transform="translate(5,-5) rotate(-90 60 65)">
    <!-- handle -->
    <rect x="54" y="40" width="14" height="82" rx="7" fill="url(#wood)" stroke="#8a5626" stroke-width="2"/>
    <line x1="61" y1="70" x2="61" y2="116" stroke="#8a5626" stroke-width="1.5" opacity="0.5"/>
    <!-- head: striking face + claw -->
    <g fill="url(#metal)" stroke="#5c636d" stroke-width="2" stroke-linejoin="round">
      <path d="M58 26 h30 a6 6 0 0 1 6 6 v14 a6 6 0 0 1 -6 6 h-30 z"/>
      <path d="M58 28 q-22 2 -30 -6 q-4 -4 0 -8 q10 8 22 4 q6 -2 8 2 z"/>
      <path d="M58 52 q-16 0 -24 -8 q10 4 20 2 q3 -1 4 2 z"/>
    </g>
    <rect x="60" y="30" width="30" height="4" rx="2" fill="#ffffff" opacity="0.3"/>
  </g>
</svg>
