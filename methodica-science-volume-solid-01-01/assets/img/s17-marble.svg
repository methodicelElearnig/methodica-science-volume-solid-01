<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="גולת זכוכית ירוקה">
  <!-- Green glass marble, drawn to match the one in s29-nongeometric.jpg: swirled cores rather
       than a flat ball, a hard specular on the upper left, a rim that darkens into the silhouette,
       and the bright caustic a real marble throws through its lower half.
       Geometry is load-bearing: the circle is r=44 at (50,48) and the art must stay inside
       viewBox 0 0 100 100 — css/style.css sizes this by WIDTH in two places (#disp-marble 78px and
       .disp-sunk-marble 26% of the cylinder), so a changed viewBox rescales both. -->
  <defs>
    <radialGradient id="mBody" cx="36%" cy="30%" r="78%">
      <stop offset="0%"   stop-color="#d8f7a8"/>
      <stop offset="22%"  stop-color="#8fd94f"/>
      <stop offset="55%"  stop-color="#3da528"/>
      <stop offset="82%"  stop-color="#1c7a18"/>
      <stop offset="100%" stop-color="#0d4d10"/>
    </radialGradient>
    <!-- Edge darkening: glass is thickest at the silhouette, so the rim reads almost black-green. -->
    <radialGradient id="mRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="72%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="93%"  stop-color="#04350a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#03260a" stop-opacity="0.75"/>
    </radialGradient>
    <!-- The light that comes back UP through the glass from the surface underneath. -->
    <radialGradient id="mCaustic" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#eaffc0" stop-opacity="0.85"/>
      <stop offset="60%"  stop-color="#b6f07a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b6f07a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mSpec" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0f3d12" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0f3d12" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="mClip"><circle cx="50" cy="48" r="44"/></clipPath>
  </defs>

  <ellipse cx="51" cy="92" rx="30" ry="7" fill="url(#mShadow)"/>
  <circle cx="50" cy="48" r="44" fill="url(#mBody)"/>

  <g clip-path="url(#mClip)">
    <!-- Swirled core. Three ribbons at different depths, all soft — the photo's marble has pale
         milky veins turning inside a darker body, not a pattern printed on the surface. -->
    <path d="M14 62 C30 34, 58 30, 84 46 C62 44, 38 52, 22 74 Z" fill="#c9f2a0" opacity="0.30"/>
    <path d="M20 74 C34 50, 60 44, 88 58 C64 58, 42 66, 28 84 Z" fill="#eafbd2" opacity="0.20"/>
    <path d="M12 46 C26 22, 56 16, 78 28 C56 26, 32 34, 20 54 Z" fill="#0f5c14" opacity="0.28"/>
    <path d="M60 88 C70 66, 84 56, 96 54 C90 70, 82 82, 74 92 Z" fill="#0c4f11" opacity="0.30"/>
  </g>

  <circle cx="50" cy="48" r="44" fill="url(#mRim)"/>
  <!-- Caustic low and slightly off-centre, opposite the key light. -->
  <ellipse cx="60" cy="72" rx="19" ry="13" fill="url(#mCaustic)"/>
  <!-- Key specular: a hard core inside a soft bloom, tilted like a real highlight. -->
  <ellipse cx="34" cy="30" rx="16" ry="11" fill="url(#mSpec)" transform="rotate(-24 34 30)"/>
  <ellipse cx="31" cy="27" rx="7.5" ry="4.6" fill="#ffffff" opacity="0.96" transform="rotate(-24 31 27)"/>
  <!-- Rim light on the shaded side, where the background wraps around the glass. Kept faint and
       thin on purpose: at 260px a 3px/0.34 stroke read as a scratch on the glass rather than as
       light, which is the failure mode to watch for if this is ever strengthened. -->
  <path d="M79 71 A44 44 0 0 0 85.5 47" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.8" stroke-linecap="round"/>
</svg>
